[project]
name = "speechlens-backend"
version = "0.1.0"
description = "SpeechLens contrastive speech analytics backend"
authors = [
    { name = "Ipshita Bhardwaj", email = "bhardwaj.ipshita0@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.0",
    "librosa==1.0.0",
    "soundfile==0.14.0",
    "av==19.0.1",
    "numpy==2.5.3",
    "pyyaml==6.0.3",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]
align = [
    "torch==2.7.1+cu126",
    "transformers==4.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "speechlens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
